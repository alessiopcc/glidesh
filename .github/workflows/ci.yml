name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'examples/**'
      - 'website/src/content/docs/**'
      - 'website/public/install.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'examples/**'
      - 'website/src/content/docs/**'
      - 'website/public/install.sh'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: Validate every example
        run: |
          status=0
          for dir in examples/*/; do
            [ -f "$dir/plan.kdl" ] || continue
            echo "::group::$dir"
            out=$(./target/x86_64-unknown-linux-musl/debug/glidesh validate -p "$dir/plan.kdl" -i "$dir/inventory.kdl" 2>&1) || status=1
            echo "$out"
            # A warning in an example is a mistake a user would copy.
            if echo "$out" | grep -q "warning:"; then status=1; fi
            echo "::endgroup::"
          done
          exit $status

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test 'integration_*'
        env:
          GLIDESH_INTEGRATION: "1"

  coverage:
    name: Code Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov
      - name: Run coverage (unit + integration)
        run: |
          cargo llvm-cov --all-targets --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --ignore-filename-regex '(main\.rs|executor/|tui/|logging/|cli\.rs)'
        env:
          GLIDESH_INTEGRATION: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
